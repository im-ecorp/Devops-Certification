# Restricted HTTP-only forward proxy for local practice. No HTTPS CONNECT.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log;
events { worker_connections 256; }
http {
    # Keep all writable state under the explicit -p lab prefix.
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    access_log logs/access.log;
    # Only these exact Host:port pairs can be fetched; never expose this to a network.
    map $http_host $allowed_origin {
        default "";
        "127.0.0.1:9001" "127.0.0.1:9001";
        "127.0.0.1:9002" "127.0.0.1:9002";
    }
    server {
        listen 127.0.0.1:8083;
        server_name _;
        location / {
            if ($request_method = CONNECT) { return 405; }
            if ($allowed_origin = "") { return 403; }
            proxy_pass http://$allowed_origin;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
