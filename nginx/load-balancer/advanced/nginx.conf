# Least-connections routing with passive failure detection and retry.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log;
events { worker_connections 256; }
http {
    # Keep all writable state under the explicit -p lab prefix.
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    access_log logs/access.log;
    upstream backends {
        least_conn;
        server 127.0.0.1:9001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:9002 max_fails=1 fail_timeout=5s;
    }
    server {
        listen 127.0.0.1:8087;
        server_name localhost;
        location / {
            proxy_pass http://backends;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
