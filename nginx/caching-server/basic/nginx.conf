# Cache successful GET/HEAD responses from the local origin for 10 seconds.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log;
events { worker_connections 256; }
http {
    # Keep all writable state under the explicit -p lab prefix.
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    access_log logs/access.log;
    proxy_cache_path cache/basic levels=1:2 keys_zone=basic_cache:1m max_size=10m inactive=1m;
    server {
        listen 127.0.0.1:8084;
        server_name localhost;
        location / {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_cache basic_cache;
            proxy_cache_valid 200 10s;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
