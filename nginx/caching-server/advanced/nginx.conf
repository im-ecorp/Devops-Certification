# Cache with stampede control and stale responses during origin errors.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log;
events { worker_connections 256; }
http {
    # Keep all writable state under the explicit -p lab prefix.
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    access_log logs/access.log;
    # Never serve a public cached representation to a personalized request.
    map $http_authorization $has_auth {
        default 1;
        "" 0;
    }
    map $http_cookie $has_cookie {
        default 1;
        "" 0;
    }
    map $uri $private_path {
        default 0;
        ~^/(private|admin)(/|$) 1;
    }
    proxy_cache_path cache/advanced levels=1:2 keys_zone=advanced_cache:1m max_size=10m inactive=1m;
    server {
        listen 127.0.0.1:8085;
        server_name localhost;
        location / {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_cache advanced_cache;
            # Both are needed: skip lookup AND prevent storing the response.
            proxy_cache_bypass $has_auth $has_cookie $private_path;
            proxy_no_cache $has_auth $has_cookie $private_path;
            proxy_cache_valid 200 10s;
            proxy_cache_lock on;
            proxy_cache_background_update on;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
