# =============================================================================
# Ansible Configuration - Production-Ready
# =============================================================================

[defaults]
# --- Inventory & Paths ---
inventory = inventory/hosts.yml
roles_path = roles
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections
inventory_ignore_extensions = ~, .orig, .bak, .cfg, .retry, .swp

# --- Connection & Execution ---
private_key_file = ~/.ssh/id_rsa
timeout = 30
forks = 15
interpreter_python = auto_silent

# --- Fact Gathering & Caching ---
gathering = smart
gather_subset = min
fact_caching = jsonfile
fact_caching_connection = ./.facts
fact_caching_timeout = 86400

# --- Output & Logging ---
stdout_callback = ansible.builtin.default
callback_result_format = yaml
callbacks_enabled = profile_tasks, timer
display_skipped_hosts = False
show_custom_stats = True
nocows = 1
log_path = ~/.ansible/ansible.log
action_warnings = False
deprecation_warnings = False

# --- Security ---
host_key_checking = False
vault_password_file = ~/.ansible/vault.pass
allow_world_readable_tmpfiles = False

# --- Retry Files ---
retry_files_enabled = False
retry_files_save_path = ~/.ansible/retry-files

# =============================================================================
[ssh_connection]
# Keep connections independent so a stale multiplex socket cannot block future runs.
ssh_args = -o ControlMaster=no -o ControlPath=none -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o UserKnownHostsFile=/dev/null
# control_path = ~/.ssh/ansible-%%r@%%h:%%p
pipelining = True

# =============================================================================
[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

