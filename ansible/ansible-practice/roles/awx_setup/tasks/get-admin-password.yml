---
# Step 8: Verify the admin Secret and display safe access information

- name: Verify the AWX admin password Secret exists
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ awx_kubectl_context }}"
      - get
      - secret
      - "{{ awx_admin_password_secret }}"
      - -n
      - "{{ awx_namespace }}"
      - -o
      - name
  register: awx_admin_secret
  changed_when: false
  tags:
    - get_password
    - setup_awx

- name: Get AWX admin password for explicit display
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ awx_kubectl_context }}"
      - get
      - secret
      - "{{ awx_admin_password_secret }}"
      - -n
      - "{{ awx_namespace }}"
      - -o
      - "jsonpath={.data.password}"
  register: admin_password_encoded
  changed_when: false
  no_log: true
  when: awx_display_admin_password
  tags:
    - get_password
    - setup_awx

- name: Decode admin password
  ansible.builtin.set_fact:
    awx_admin_password_display: "{{ admin_password_encoded.stdout | b64decode }}"
  no_log: true
  when: awx_display_admin_password
  tags:
    - get_password
    - setup_awx

- name: Display AWX access information
  ansible.builtin.debug:
    msg:
      - "AWX deployment complete!"
      - "URL: {{ 'https://' ~ awx_hostname if awx_nginx_enabled else 'http://' ~ awx_nodeport_listen_address ~ ':' ~ (awx_nodeport_port | string) }}"
      - "Username: {{ awx_admin_user }}"
      - "Password retrieval: kubectl --context {{ awx_kubectl_context }} get secret {{ awx_admin_password_secret }} -n {{ awx_namespace }} -o jsonpath='{.data.password}' | base64 --decode; echo"
      - ""
      - "AWX NodePort: {{ awx_nodeport_listen_address }}:{{ awx_nodeport_port }}"
      - "Nginx site: {{ awx_nginx_config_path if awx_nginx_enabled else 'disabled' }}"
  tags:
    - get_password
    - setup_awx

- name: Display AWX administrator password when explicitly requested
  ansible.builtin.debug:
    msg: "AWX administrator password: {{ awx_admin_password_display }}"
  when: awx_display_admin_password
  tags:
    - get_password
    - setup_awx
