---
# Step 1: Verify Docker is installed and running
#
# Query the Docker daemon through the Docker CLI instead of the systemd unit.
# `docker version --format {{.Server.Version}}` only returns a server version
# when the client can reach a running daemon, so it verifies both that Docker
# is installed and that the daemon is up, without assuming systemd is the init
# system (Kind itself only requires a reachable Docker daemon).

- name: Query the Docker server version
  ansible.builtin.command: docker version --format '{{ "{{.Server.Version}}" }}'
  register: docker_version
  changed_when: false
  failed_when: false
  tags:
    - verify_docker
    - setup_awx

- name: Assert the Docker daemon is installed and reachable
  ansible.builtin.assert:
    that:
      - docker_version.rc == 0
      - docker_version.stdout | trim | length > 0
    success_msg: "Docker daemon is running (version: {{ docker_version.stdout | trim }})"
    fail_msg: >-
      The Docker daemon is not installed or not reachable
      ({{ docker_version.stderr | default('no server version reported') | trim }})
  tags:
    - verify_docker
    - setup_awx