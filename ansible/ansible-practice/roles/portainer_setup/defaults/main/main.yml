---

# Portainer Docker image version tag
portainer_image_tag: "2.39.5"

# Docker restart policy for the Portainer container
restart_policy: "always"

# Service directory on the remote host
service_dir: "{{ project_dir }}/portainer"

# Domain names used by Portainer HTTP routing
portainer_main_domain: "portainer.{{ main_domain }}"
# Portainer API base URL used for license operations (must be reachable
# from the target host, e.g. through Traefik)
portainer_api_url: "https://{{ portainer_main_domain }}"

portainer_edge_domain: "portainer-edge.{{ main_domain }}"

# Validate TLS certificates when talking to the Portainer API
portainer_validate_certs: false


