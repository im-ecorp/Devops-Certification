---
# --- DEBIAN / UBUNTU ---
- name: Update apt cache and upgrade packages (Debian family)
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
  when: ansible_facts["os_family"] == 'Debian'
  tags:
    - install_packages

# --- REDHAT / ALMALINUX / ROCKY ---
- name: Update DNF/YUM cache and upgrade packages (RedHat family)
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  when: ansible_facts["os_family"] == 'RedHat'
  tags:
    - install_packages

# --- COMMON TASKS ---
- name: Install basic tools
  ansible.builtin.package:
    name: >-
      {{
        preparing_server_common_packages
        + (
          preparing_server_debian_packages
          if ansible_facts["os_family"] == "Debian"
          else preparing_server_redhat_packages
        )
      }}
    state: present
  tags:
    - install_packages

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags:
    - install_packages

# --- CLEANUP TASKS ---
- name: Remove unused APT dependencies
  ansible.builtin.apt:
    autoremove: true
    autoclean: true
  when: ansible_facts["os_family"] == 'Debian'
  tags:
    - install_packages

- name: Remove unused DNF/YUM dependencies
  ansible.builtin.dnf:
    autoremove: true
  when: ansible_facts["os_family"] == 'RedHat'
  tags:
    - install_packages

- name: Fix /etc/hosts
  ansible.builtin.template:
    src: etc/hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
  tags:
    - install_packages

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  tags:
    - install_packages
    - reboot_check
    
- name: Notify if reboot is required
  ansible.builtin.debug:
    msg: "Server {{ inventory_hostname }} requires a reboot!"
  when: reboot_required_file.stat.exists
  tags:
    - install_packages
    - reboot_check
