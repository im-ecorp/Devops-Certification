---

# SSH jail settings
linux_fail2ban_ssh_enabled: true
linux_fail2ban_ssh_port: "{{ ssh_port | default('ssh') }}"
linux_fail2ban_ssh_filter: "sshd"
linux_fail2ban_ssh_logpath: "/var/log/auth.log"
linux_fail2ban_whitelist_ips:
  - "127.0.0.1/8"
  - "::1"
  - "89.167.72.70"
  - "77.221.141.93"
linux_fail2ban_ssh_maxretry: 5
linux_fail2ban_ssh_bantime: 3600
linux_fail2ban_ssh_findtime: 600

# Backend for log monitoring
linux_fail2ban_backend: "systemd"


preparing_server_common_packages:
  - curl
  - vim
  - git
  - wget
  - bash-completion
  - tmux
  - zip
  - unzip

# Debian-specific package names.
preparing_server_debian_packages:
  - iptables-persistent

# Add Red Hat-specific package names here when required.
preparing_server_redhat_packages: []
