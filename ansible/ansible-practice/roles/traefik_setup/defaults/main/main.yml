---
# Default variables for Traefik setup

# Docker image tag
traefik_image_tag: "v3.7.10"

# Traefik dashboard subdomain
traefik_domain: "traefik.{{ main_domain }}"

# Container restart policy (always, on-failure, unless-stopped)
restart_policy: "on-failure"

# Email address for Let's Encrypt ACME certificate notifications
acme_email: hossein3piol@proton.me

# Service directory on the remote host
service_dir: "{{ project_dir }}/traefik"
