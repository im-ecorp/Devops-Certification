---

- name: "Delete Nexus repository: {{ item }}"
  block:
    - name: Check if repository exists
      ansible.builtin.uri:
        url: "{{ nexus_main_url }}/service/rest/v1/repositories/{{ item }}"
        method: GET
        user: "{{ nexus_user }}"
        password: "{{ nexus_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code:
          - 200
          - 404
      register: repo_check

    - name: Delete repository
      ansible.builtin.uri:
        url: "{{ nexus_main_url }}/service/rest/v1/repositories/{{ item }}"
        method: DELETE
        user: "{{ nexus_user }}"
        password: "{{ nexus_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 204
      when: repo_check.status == 200

  rescue:
    - name: Handle deletion failure
      ansible.builtin.debug:
        msg: >-
          Failed to delete repository '{{ item }}' from Nexus.
          Error: {{ ansible_failed_result.msg | default('unknown error') }}

    - name: Fail with explicit message
      ansible.builtin.fail:
        msg: "Repository deletion for '{{ item }}' failed. See above for details."

  tags:
    - setup_nexus
    - config_nexus
    - delete_repository
