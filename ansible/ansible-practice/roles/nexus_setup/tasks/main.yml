---

- name: Setup Nexus Service
  ansible.builtin.import_tasks: installation.yml
  tags:
    - install_nexus
    - setup_nexus

- name: Configuration Nexus | Delete repo
  ansible.builtin.include_tasks: delete-repo.yml
  loop: "{{ delete_repos }}"
  loop_control:
    loop_var: item
  tags:
    - setup_nexus
    - config_nexus
    - delete_repository

- name: Configuration Nexus | Create blob store
  ansible.builtin.include_tasks: create-blob-store.yml
  loop: "{{ create_blob_stores }}"
  loop_control:
    loop_var: item
  tags:
    - setup_nexus
    - config_nexus
    - create_blob_store

- name: Configuration Nexus | Create cleanup policy
  ansible.builtin.include_tasks: create-cleanup-policy.yml
  loop: "{{ create_cleanup_policies }}"
  loop_control:
    loop_var: item
  tags:
    - setup_nexus
    - config_nexus
    - create_cleanup_policy

- name: Configuration Nexus | Create APT repo
  ansible.builtin.include_tasks: create-apt-repo.yml
  loop: "{{ create_apt_repository }}"
  loop_control:
    loop_var: item
  tags:
    - setup_nexus
    - config_nexus
    - create_apt_repo

- name: Configuration Nexus | Create Docker repo
  ansible.builtin.include_tasks: create-docker-repo.yml
  loop: "{{ create_docker_repository }}"
  loop_control:
    loop_var: item
  tags:
    - setup_nexus
    - config_nexus
    - create_docker_repo
