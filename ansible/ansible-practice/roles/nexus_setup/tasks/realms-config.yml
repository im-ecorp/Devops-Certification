---

- name: "Configure Realms: {{ realm_config.name }}"
  block:
    - name: Get active realms
      ansible.builtin.uri:
        url: "{{ nexus_main_url }}/service/rest/v1/security/realms/active"
        method: GET
        user: "{{ nexus_user }}"
        password: "{{ nexus_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: realms_check

    - name: Enable realm
      ansible.builtin.uri:
        url: "{{ nexus_main_url }}/service/rest/v1/security/realms/active"
        method: PUT
        user: "{{ nexus_user }}"
        password: "{{ nexus_password }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Content-Type: "application/json"
        body_format: json
        body: "{{ realms_check.json + [realm_config.id] }}"
        status_code: 204
      when: realm_config.id not in realms_check.json

  rescue:
    - name: Handle realm configuration failure
      ansible.builtin.debug:
        msg: >-
          Failed to configure realm '{{ realm_config.name }}'.
          Error: {{ ansible_failed_result.msg | default('unknown error') }}

    - name: Fail with explicit message
      ansible.builtin.fail:
        msg: "Realm configuration for '{{ realm_config.name }}' failed. See above for details."

  tags:
    - setup_nexus
    - config_nexus
    - realms_config
