- name: install official docker repository for debian base
  become: true
  ansible.builtin.template:
    src: etc/apt/sources.list.d/docker.list.j2
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: '0644'

- name: Update APT cache
  become: true
  ansible.builtin.apt:
    update_cache: true