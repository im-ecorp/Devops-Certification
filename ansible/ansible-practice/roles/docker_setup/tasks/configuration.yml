---

- name: create docker config directory
  become: true
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: create config docker daemon.json
  become: true
  ansible.builtin.template:
    src: etc/docker/daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: 
    - restart docker

