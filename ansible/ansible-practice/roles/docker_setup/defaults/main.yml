---
# Default variables for Docker setup

# System dependencies required before Docker installation
docker_dependencies:
  - acl
  - python3-ruamel.yaml
  - python3-pip
  - python3-docker
  - python3-requests
  - python3-urllib3
  - python3-virtualenv
  - net-tools
  - iproute2
  - gpg

# Docker packages to install
docker_packages:
  - acl
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
  - docker-ce-rootless-extras
  - docker-buildx-plugin
  - docker-model-plugin

# Use Nexus as the package mirror instead of official Docker repos
use_nexus: false

# Repository and GPG key configuration
docker_repo:
  channel:
    stable_enabled: true
    test_enabled: false
    nightly_enabled: false
  nexus_repo_urls:
    debian: "https://repo.mecan.ir/repository/debian-docker/"
    ubuntu: "https://repo.mecan.ir/repository/ubuntu-docker/"
  nexus_gpg_urls:
    debian: "https://repo.mecan.ir/repository/debian-docker/gpg"
    ubuntu: "https://repo.mecan.ir/repository/ubuntu-docker/gpg"
  official_repo_url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
  official_gpg_url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"

# Resolved repository and GPG URLs (Nexus or official)
repo_url: "{{ docker_repo.nexus_repo_urls[ansible_facts.distribution | lower] if use_nexus else docker_repo.official_repo_url }}"
gpg_url: "{{ docker_repo.nexus_gpg_urls[ansible_facts.distribution | lower] if use_nexus else docker_repo.official_gpg_url }}"
docker_gpg_key_path: /etc/apt/keyrings/docker.asc

# Docker daemon configuration (daemon.json)
docker_config:
  # HTTP/HTTPS proxy for the Docker daemon
  proxy:
    enabled: false
    http_proxy: "http://127.0.0.1:8090"
    https_proxy: "{{ docker_config.proxy.http_proxy }}"
    no_proxy: "hub.mecan.ir, 127.0.0.1/8, localhost"
  # Container log rotation
  logging:
    enabled: true
    labels: "{{ inventory_hostname }}"
    max_file: "5"
    max_size: "100M"
  # Pull-through registry mirror
  mirror_registry:
    enabled: true
    urls: "https://hub.hamdocker.ir"
  # Registries that do not require TLS verification
  insecure_registry:
    enabled: true
    urls: "https://test.k8sforfun.com"
  # Keep containers running across Docker daemon restarts
  live_restore:
    enabled: true
  # Enable experimental Docker features
  experimental:
    enabled: true
