---
- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
    fail_msg: "nginx_setup supports host Nginx on Debian and Ubuntu only."
  tags:
    - always

- name: Install Nginx package
  ansible.builtin.apt:
    name: "{{ nginx_package_name }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ nginx_apt_cache_valid_time }}"
