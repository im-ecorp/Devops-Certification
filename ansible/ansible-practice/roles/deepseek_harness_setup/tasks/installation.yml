---

- name: Create Docker networks
  community.docker.docker_network:
    name: "{{ item }}"
    driver_options:
      com.docker.network.bridge.name: "{{ item }}"
    state: present
  loop:
    - web_net
    - app_net
  tags:
    - preparing
    - docker

- name: Create service directory
  ansible.builtin.file:
    path: "{{ service_dir }}"
    state: directory
    mode: "0755"
  tags:
    - preparing

# Owned by the image's node user (1000), which runs the container
- name: Create persistent data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ service_dir }}/home"
    - "{{ service_dir }}/workspace"
  tags:
    - preparing

- name: Copy entrypoint script
  ansible.builtin.copy:
    src: entrypoint.sh
    dest: "{{ service_dir }}/entrypoint.sh"
    mode: "0755"
  notify: Restart DeepSeek Harness
  tags:
    - preparing

- name: Template Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ service_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart DeepSeek Harness
  tags:
    - preparing

- name: Template environment file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ service_dir }}/.env"
    mode: "0600"
  notify: Restart DeepSeek Harness
  tags:
    - preparing

- name: Pull Docker images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ service_dir }}"
  register: compose_pull
  tags:
    - pull

- name: Deploy Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ service_dir }}"
    state: present
  register: compose_deploy
  tags:
    - deploy

# Traefik basic auth guards the UI, so 401 means the route is up
- name: Wait for DeepSeek Harness to be available
  ansible.builtin.uri:
    url: "{{ deepseek_url }}/"
    method: GET
    status_code: [200, 401]
    timeout: 10
  register: deepseek_health
  until: deepseek_health.status in [200, 401]
  retries: 30
  delay: 10
  tags:
    - deploy
