---
# --- DEBIAN / UBUNTU ---
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
  when: ansible_facts["os_family"] == 'Debian'
  tags:
    - update_os

# --- REDHAT / ALMALINUX / ROCKY ---
- name: Update DNF/YUM cache and upgrade packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  when: ansible_facts["os_family"] == 'RedHat'
  tags:
    - update_os

# --- CLEANUP ---
- name: Remove unused APT dependencies
  ansible.builtin.apt:
    autoremove: true
    autoclean: true
  when: ansible_facts["os_family"] == 'Debian'
  tags:
    - cleanup

- name: Remove unused DNF/YUM dependencies
  ansible.builtin.dnf:
    autoremove: true
  when: ansible_facts["os_family"] == 'RedHat'
  tags:
    - cleanup

# --- REBOOT CHECK ---
- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  tags:
    - reboot_check

- name: Warn if a reboot is required
  ansible.builtin.debug:
    msg: "Server {{ inventory_hostname }} requires a reboot!"
  when: reboot_required_file.stat.exists
  tags:
    - reboot_check