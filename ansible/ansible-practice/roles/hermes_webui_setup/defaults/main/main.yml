---
# Default variables for Hermes WebUI setup

# Hermes WebUI release used with the locally installed Hermes Agent source.
# Keep this pinned: WebUI imports Hermes Agent internals and version drift can
# otherwise break session/config compatibility unexpectedly.
hermes_webui_image_tag: "0.52.106"

# Container restart policy (always, on-failure, unless-stopped)
restart_policy: "unless-stopped"

# Service directory on the remote host
service_dir: "{{ project_dir }}/hermes-webui"

# Existing Hermes installation created by the official host installer.
hermes_webui_home_dir: "/root/.hermes"
hermes_webui_agent_dir: "/usr/local/lib/hermes-agent"
hermes_webui_agent_export_dir: "{{ service_dir }}/agent-source"

# WebUI-owned state is deliberately kept outside the existing Hermes CLI home.
# The WebUI can still read CLI sessions from hermes_webui_home_dir/state.db.
hermes_webui_state_dir: "{{ service_dir }}/state"
hermes_webui_workspace_dir: "{{ project_dir }}/hermes-workspace"

# The official WebUI entrypoint cannot remap its runtime account to UID 0
# safely. When the existing Hermes home is root-owned, use the guarded wrapper
# shipped by this role. It skips recursive chown/chmod and runs inside the
# container as root so the host-owned Hermes data keeps its ownership.
hermes_webui_allow_root_runtime: true

# Domain name for Hermes WebUI (used by Traefik)
hermes_webui_domain: "hermes.{{ main_domain }}"
hermes_webui_url: "https://{{ hermes_webui_domain }}"

# Container port served to Traefik (not published on the host)
hermes_webui_port: 8787

# HTTPS / reverse-proxy settings (the service runs behind Traefik)
hermes_webui_secure: 1
hermes_webui_allowed_origins: "{{ hermes_webui_url }}"
hermes_webui_trust_forwarded_host: 1
hermes_webui_trust_forwarded_for: 1
hermes_webui_trust_forwarded_proto: 1

# Existing config.yaml is authoritative; do not launch the onboarding wizard.
hermes_webui_skip_onboarding: 1

# Never rewrite credential modes in the existing Hermes CLI home.
hermes_webui_skip_chmod: 1
