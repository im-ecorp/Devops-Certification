---
# Default variables for Hermes WebUI setup

# Docker image tag of ghcr.io/nesquena/hermes-webui (pin a released version;
# 0.52.353 is the build tested against the installed Hermes Agent)
hermes_webui_image_tag: "latest"

# Container restart policy (always, on-failure, unless-stopped)
restart_policy: "unless-stopped"

# Service directory on the remote host
service_dir: "{{ project_dir }}/hermes-webui"

# Domain name for Hermes WebUI (used by Traefik)
hermes_webui_domain: "hermes.{{ main_domain }}"
hermes_webui_url: "https://{{ hermes_webui_domain }}"

# Port the app listens on inside the container (served to Traefik only)
hermes_webui_port: "8787"

# Minimum length of the vaulted login password; the service is public
hermes_webui_password_min_length: 16

# Recreate the container even when nothing changed, e.g. after editing the
# shared Hermes config.yaml (run with -e hermes_webui_force_recreate=true)
hermes_webui_force_recreate: false

# Existing Hermes CLI home created by the host installer (config.yaml,
# auth.json, state.db). Mounted as the container's ~/.hermes; never created here
hermes_webui_home_dir: "/root/.hermes"

# Installed Hermes Agent source on the host
hermes_webui_agent_dir: "/usr/local/lib/hermes-agent"

# Host build artefacts left out of the Agent source copy mounted at /opt/hermes
hermes_webui_agent_source_excludes:
  - ".git/"
  - "venv/"
  - ".venv/"
  - "node_modules/"
  - "__pycache__/"
  - "*.pyc"
  - "*.egg-info/"
  - ".playwright/"
  - ".pytest_cache/"
  - ".mypy_cache/"
  - ".ruff_cache/"

# Host directories mounted at the same path inside the container, so a path
# typed in the WebUI resolves to the file the host sees
hermes_webui_workspaces:
  - path: "/root"
    read_only: false

# Container system directories that must never be mounted over as a workspace
hermes_webui_workspace_forbidden_paths:
  - "/"
  - "/bin"
  - "/boot"
  - "/dev"
  - "/etc"
  - "/lib"
  - "/lib32"
  - "/lib64"
  - "/proc"
  - "/run"
  - "/sbin"
  - "/sys"
  - "/tmp"
  - "/usr"
  - "/var"

# Mount the whole host filesystem at a prefix (the host's /etc is /host/etc)
hermes_webui_host_fs_enabled: true
hermes_webui_host_fs_mount_point: "/host"
hermes_webui_host_fs_read_only: false

# Mount the host SSH directory read-only as the agent's ~/.ssh
hermes_webui_ssh_enabled: true
hermes_webui_ssh_dir: "/root/.ssh"
hermes_webui_ssh_key_name: "id_rsa"

# Publish the Docker host inside the container so the agent can SSH back and
# run systemctl, docker or ansible-playbook on the host (needs the SSH mount)
hermes_webui_host_executor_enabled: true
hermes_webui_host_alias: "host.docker.internal"
hermes_webui_host_ssh_port: "{{ ansible_port | default(22) }}"

# Python the WebUI builds its venv with. Hermes Agent declares its core
# dependencies for Python 3.14 only, while the image defaults to 3.13
hermes_webui_python_version: "3.14"

# PATH inside the container; /app/venv/bin provides the bundled `hermes` CLI
hermes_webui_container_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/app/venv/bin"

# HTTPS and reverse-proxy settings (Traefik terminates TLS)
hermes_webui_secure: "1"
hermes_webui_trust_forwarded: "1"

# Use the existing config.yaml as-is: no onboarding wizard, no credential chmod
hermes_webui_skip_onboarding: "1"
hermes_webui_skip_chmod: "1"

# Container limits and log rotation
hermes_webui_memory_limit: "4g"
hermes_webui_cpu_limit: "2.0"
hermes_webui_log_max_size: "20m"
hermes_webui_log_max_file: "5"
