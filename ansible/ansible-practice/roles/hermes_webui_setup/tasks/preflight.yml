---
# Checks that run before anything on the host is changed. Tagged `always`
# because the templates read hermes_webui_home_stat.

- name: Check the WebUI login password
  ansible.builtin.assert:
    that:
      - hermes_webui_password is defined
      - hermes_webui_password | length >= hermes_webui_password_min_length | int
    fail_msg: >-
      hermes_webui_password must be at least
      {{ hermes_webui_password_min_length }} characters, because
      {{ hermes_webui_domain }} is public. Set it in defaults/main/vault.yml.
    quiet: true
  no_log: true

- name: Check that the host executor has SSH keys to use
  ansible.builtin.assert:
    that:
      - hermes_webui_ssh_enabled | bool or not hermes_webui_host_executor_enabled | bool
    fail_msg: "hermes_webui_host_executor_enabled needs hermes_webui_ssh_enabled."
    quiet: true

- name: Check the Hermes home directory
  ansible.builtin.stat:
    path: "{{ hermes_webui_home_dir }}"
  register: hermes_webui_home_stat

- name: Require an existing Hermes home directory
  ansible.builtin.assert:
    that:
      - hermes_webui_home_stat.stat.isdir is defined
      - hermes_webui_home_stat.stat.isdir
    fail_msg: >-
      {{ hermes_webui_home_dir }} is not a directory. Install Hermes on the host
      first; this role does not create an empty Hermes home.
    quiet: true

- name: Check the Hermes config, session database and Agent source
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_webui_home_dir }}/config.yaml"
    - "{{ hermes_webui_home_dir }}/state.db"
    - "{{ hermes_webui_agent_dir }}/pyproject.toml"
  register: hermes_webui_required_files

- name: Require the Hermes config, session database and Agent source
  ansible.builtin.assert:
    that:
      - item.stat.isreg is defined
      - item.stat.isreg
    fail_msg: "Required Hermes file is missing: {{ item.item }}"
    quiet: true
  loop: "{{ hermes_webui_required_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check the agent workspaces
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ hermes_webui_workspaces }}"
  loop_control:
    label: "{{ item.path }}"
  register: hermes_webui_workspace_stat

# Docker would create a missing path as an empty directory, and mounting over
# /etc or /usr replaces the OS the WebUI runs on.
- name: Require every workspace to be an existing, safe directory
  ansible.builtin.assert:
    that:
      - item.item.path is match('^/')
      - item.item.path | regex_replace('/$', '') not in hermes_webui_workspace_forbidden_paths
      - item.stat.isdir is defined
      - item.stat.isdir
    fail_msg: >-
      Workspace {{ item.item.path }} must be an existing absolute directory
      outside {{ hermes_webui_workspace_forbidden_paths | join(', ') }}.
      Reach system paths through {{ hermes_webui_host_fs_mount_point }} instead.
    quiet: true
  loop: "{{ hermes_webui_workspace_stat.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Check the SSH private key
  ansible.builtin.stat:
    path: "{{ hermes_webui_ssh_dir }}/{{ hermes_webui_ssh_key_name }}"
  register: hermes_webui_ssh_key_stat
  when: hermes_webui_ssh_enabled | bool

- name: Require the SSH private key
  ansible.builtin.assert:
    that:
      - hermes_webui_ssh_key_stat.stat.isreg is defined
      - hermes_webui_ssh_key_stat.stat.isreg
    fail_msg: >-
      {{ hermes_webui_ssh_dir }}/{{ hermes_webui_ssh_key_name }} is missing.
      Provide the key or set hermes_webui_ssh_enabled=false.
    quiet: true
  when: hermes_webui_ssh_enabled | bool
