---
# A healthy container is not proof that the agent can work. These checks run
# inside the container, where the agent runs.

- name: Check that the hermes CLI is on the container PATH
  community.docker.docker_container_exec:
    container: hermes-webui
    argv: ["/bin/sh", "-c", "command -v hermes"]
  changed_when: false

- name: Check that the workspaces are mounted
  community.docker.docker_container_exec:
    container: hermes-webui
    argv: ["test", "-d", "{{ item.path }}"]
  changed_when: false
  loop: "{{ hermes_webui_workspaces }}"
  loop_control:
    label: "{{ item.path }}"

- name: Check that the host filesystem is mounted
  community.docker.docker_container_exec:
    container: hermes-webui
    argv: ["test", "-r", "{{ hermes_webui_host_fs_mount_point }}/etc/hostname"]
  changed_when: false
  when: hermes_webui_host_fs_enabled | bool

# End to end: host alias, SSH key and Ansible on the host
- name: Check that the agent can run Ansible on the host
  community.docker.docker_container_exec:
    container: hermes-webui
    argv:
      - /bin/sh
      - -c
      - $HERMES_HOST_EXECUTOR_SSH -o ConnectTimeout=10 "$HERMES_HOST_EXECUTOR_ENV ansible-playbook --version"
  changed_when: false
  when: hermes_webui_host_executor_enabled | bool
