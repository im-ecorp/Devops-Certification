---

- name: Create Docker networks
  community.docker.docker_network:
    name: "{{ item }}"
    driver_options:
      com.docker.network.bridge.name: "{{ item }}"
    state: present
  loop: "{{ hermes_webui_docker_networks }}"

- name: Create the service directory tree
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ service_dir }}"
      mode: "0750"
    - path: "{{ hermes_webui_agent_export_dir }}"
      mode: "0755"
    - path: "{{ hermes_webui_state_dir }}"
      owner: "{{ hermes_webui_uid }}"
      group: "{{ hermes_webui_gid }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Export installed Agent source without host build artifacts
  ansible.builtin.command:
    argv: >-
      {{
        ['rsync', '--archive', '--delete', '--itemize-changes']
        + hermes_webui_agent_export_excludes
          | map('regex_replace', '^', '--exclude=')
          | list
        + [
            hermes_webui_agent_dir ~ '/',
            hermes_webui_agent_export_dir ~ '/',
          ]
      }}
  register: hermes_webui_agent_export
  changed_when: hermes_webui_agent_export.stdout | length > 0

- name: Pull the Hermes WebUI image
  community.docker.docker_image_pull:
    name: "{{ hermes_webui_effective_image | trim }}"
  register: hermes_webui_image_pull
  retries: 3
  delay: 10
  until: hermes_webui_image_pull is succeeded

- name: Install guarded entrypoint for a root-owned Hermes home
  ansible.builtin.template:
    src: root-entrypoint.sh.j2
    dest: "{{ hermes_webui_entrypoint_path }}"
    owner: root
    group: root
    mode: "0755"
  register: hermes_webui_entrypoint
  when: hermes_webui_root_owned_home | bool

- name: Remove the guarded entrypoint when it is not in use
  ansible.builtin.file:
    path: "{{ hermes_webui_entrypoint_path }}"
    state: absent
  when: not (hermes_webui_root_owned_home | bool)

- name: Template environment file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ hermes_webui_env_path }}"
    owner: root
    group: root
    mode: "0600"
  register: hermes_webui_env
  no_log: true

- name: Template Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hermes_webui_compose_path }}"
    owner: root
    group: root
    mode: "0640"
  register: hermes_webui_compose

# Catch a malformed template before it takes the running service down.
- name: Validate the rendered Compose project
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ service_dir }}"
  changed_when: false

- name: Collect the change signals that require a container recreate
  ansible.builtin.set_fact:
    hermes_webui_needs_recreate: >-
      {{
        [
          hermes_webui_agent_export.changed | default(false),
          hermes_webui_image_pull.changed | default(false),
          hermes_webui_entrypoint.changed | default(false),
          hermes_webui_env.changed | default(false),
          hermes_webui_compose.changed | default(false),
        ] is any
      }}

- name: Deploy Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ service_dir }}"
    state: present
    pull: never
    recreate: "{{ 'always' if hermes_webui_needs_recreate | bool else 'auto' }}"
    wait: true
    wait_timeout: "{{ (hermes_webui_health_retries | int) * (hermes_webui_health_delay | int) }}"
  register: hermes_webui_compose_deploy
