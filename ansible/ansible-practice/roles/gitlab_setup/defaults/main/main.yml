---
# Default variables for GitLab setup

# Docker image version for GitLab CE
gitlab_image_tag: "19.4.1-ce.0"

# Container restart policy (always, on-failure, unless-stopped)
restart_policy: "always"

# Service directory on the remote host
service_dir: "{{ project_dir }}/gitlab"

# Domain names for GitLab and its container registry
# GitLab and the registry use the apex domain, not main_domain (w.k8sforfun.com) like the other services
gitlab_main_domain: "git.k8sforfun.com"
gitlab_main_url: "https://{{ gitlab_main_domain }}"
gitlab_registry_domain: "reg.k8sforfun.com"

# Container registry (Docker images per project); off saves about 60 MB
gitlab_registry_enabled: true

# Host port for Git over SSH (git@<domain>); the host's own sshd keeps port 22 or ansible_port
gitlab_ssh_port: 2222

# Container memory limit and shared memory (GitLab needs more than Docker's 64 MB default)
gitlab_memory_limit: "4g"
gitlab_shm_size: "256m"

# Maximum request size through GitLab's nginx (pushes, uploads)
gitlab_client_max_body_size: "250m"

# GitLab's documented settings for small servers: single Puma process, Sidekiq
# concurrency 10, Gitaly limits, Kubernetes agent server and in-app metrics off,
# plus nginx and PostgreSQL sized for the container instead of the host
gitlab_low_memory: true

# Admin area settings. They live in GitLab's database, not gitlab.rb, so the role
# applies them through GitLab's Rails console after startup.
# Public sign-up page; off = only administrators create accounts
gitlab_signup_enabled: false
# Web IDE loads VS Code assets from this isolated wildcard domain (GitLab's default CDN)
gitlab_web_ide_extension_host_domain: "cdn.web-ide.gitlab-static.net"
# Off = never fall back to serving those assets from GitLab's own origin
gitlab_web_ide_single_origin_fallback_enabled: false

# Outgoing email through the mailserver; the password lives in vault.yml
gitlab_smtp_enable: true
gitlab_smtp_address: "mail.k8sforfun.com"
gitlab_smtp_port: 465
gitlab_smtp_domain: "k8sforfun.com"
gitlab_smtp_username: "admin@k8sforfun.com"
gitlab_email_from: "{{ gitlab_smtp_username }}"
gitlab_email_display_name: "GitLab"

# Rate limiting — IPs that bypass RackAttack
gitlab_ip_whitelist:
  - "127.0.0.1"
  - "94.182.18.26"
  - "89.167.72.70"

# Daily backup (gitlab-backup create) run from the host's cron
gitlab_backup_cron_enabled: true
gitlab_backup_cron_hour: "3"
gitlab_backup_cron_minute: "0"

# Keep local backups for 7 days (seconds)
gitlab_backup_keep_time: 604800

# Components left out of backups (comma separated, empty = back up everything)
gitlab_backup_skip: "registry"

# Copy each backup to MinIO (S3-compatible). Off = local backups only.
# When on, set gitlab_minio_access_key and gitlab_minio_secret_key in vault.yml
gitlab_minio_enabled: false
gitlab_minio_endpoint: "https://minio-api.{{ main_domain }}"
gitlab_minio_region: "us-east-1"
gitlab_minio_bucket: "gitlab-backups"

# List of runners to configure
gitlab_runners: []
  # - name: "shared-runner-1"
