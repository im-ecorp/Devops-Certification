---
- name: Check for a system-level Hermes gateway unit
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-gateway.service
  register: hermes_update_system_unit
  when: hermes_update_gateway_scope == 'auto'
  tags:
    - hermes_update

- name: Set Hermes gateway service scope
  ansible.builtin.set_fact:
    hermes_update_gateway_system: >-
      {{ hermes_update_gateway_scope == 'system'
         or (hermes_update_gateway_scope == 'auto' and hermes_update_system_unit.stat.exists) }}
  tags:
    - hermes_update

- name: Check Hermes Agent update availability
  ansible.builtin.command:
    argv:
      - "{{ hermes_update_binary }}"
      - update
      - --check
  register: hermes_update_check
  changed_when: false
  tags:
    - hermes_update

- name: Show Hermes Agent update status
  ansible.builtin.debug:
    msg: "{{ hermes_update_check.stdout_lines }}"
  tags:
    - hermes_update

# Hermes warns here when earlier-pulled code is still waiting for a gateway
# restart (for example, a previous run failed before restarting).
- name: Check for a pending Hermes gateway restart
  ansible.builtin.command:
    argv: >-
      {{ [hermes_update_binary, 'gateway', 'status']
         + (['--system'] if hermes_update_gateway_system | bool else []) }}
  register: hermes_update_gateway_status
  changed_when: false
  failed_when: false
  tags:
    - hermes_update

- name: Update Hermes Agent without a backup
  ansible.builtin.command:
    argv:
      - "{{ hermes_update_binary }}"
      - update
      - --yes
      - --no-backup
      - --no-gateway-restart
  register: hermes_update_result
  changed_when: true
  when: "'Update available' in hermes_update_check.stdout"
  tags:
    - hermes_update

- name: Restart Hermes gateway
  ansible.builtin.command:
    argv: >-
      {{ [hermes_update_binary, 'gateway', 'restart']
         + (['--system'] if hermes_update_gateway_system | bool else []) }}
  changed_when: true
  when: >-
    hermes_update_result is changed
    or 'did not restart running gateways' in hermes_update_gateway_status.stderr
  tags:
    - hermes_update

- name: Verify Hermes gateway is active
  ansible.builtin.command:
    argv: >-
      {{ ['systemctl']
         + ([] if hermes_update_gateway_system | bool else ['--user', '--machine=root@'])
         + ['is-active', 'hermes-gateway.service'] }}
  register: hermes_gateway_active
  changed_when: false
  retries: 5
  delay: 3
  until: hermes_gateway_active.rc == 0
  tags:
    - hermes_update

- name: Read installed Hermes Agent version
  ansible.builtin.command:
    argv:
      - "{{ hermes_update_binary }}"
      - --version
  register: hermes_update_version
  changed_when: false
  tags:
    - hermes_update

- name: Show final Hermes Agent state
  ansible.builtin.debug:
    msg:
      - "Gateway: {{ hermes_gateway_active.stdout }} ({{ 'system' if hermes_update_gateway_system | bool else 'user' }} service)"
      - "Version: {{ hermes_update_version.stdout_lines | first }}"
  tags:
    - hermes_update
