services:
  redis:
    image: redis:${redis_image_tag}
    container_name: omniroute_redis
    hostname: omniroute_redis
    restart: ${restart_policy}
    volumes:
      - redis_data:/data
    # Rate-limiter/cache data only: cap memory and evict instead of erroring
    command: redis-server --save 60 1 --loglevel warning --maxmemory ${omniroute_redis_maxmemory} --maxmemory-policy allkeys-lru
    security_opt:
      - no-new-privileges:true
    mem_limit: ${omniroute_redis_memory_limit}
    cpus: ${omniroute_redis_cpu_limit}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_net

  omniroute:
    image: diegosouzapw/omniroute:${image_tag}
    container_name: omniroute
    hostname: omniroute
    restart: ${restart_policy}
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - PORT=${omniroute_port}
      - DASHBOARD_PORT=${omniroute_port}
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - BASE_URL=${omniroute_base_url}
      - NEXT_PUBLIC_BASE_URL=${omniroute_base_url}
      - CLOUD_URL=${omniroute_cloud_url}
      - NEXT_PUBLIC_CLOUD_URL=${omniroute_cloud_url}
      - AUTH_COOKIE_SECURE=${omniroute_auth_cookie_secure}
      - REQUIRE_API_KEY=${omniroute_require_api_key}
      - OMNIROUTE_MEMORY_MB=${omniroute_memory_mb}
    # Loopback only: used by the role's health wait and as an SSH-tunnel
    # fallback for LOCAL_ONLY dashboard features. Via Traefik, Export All needs
    # the app's LOCAL_ONLY bypass list (see README "Backups and Export All").
    ports:
      - "127.0.0.1:${omniroute_local_port}:${omniroute_port}"
    # Image runs as the non-root `node` user; limits follow upstream contrib/vps
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${omniroute_pids_limit}
    mem_limit: ${omniroute_memory_limit}
    cpus: ${omniroute_cpu_limit}
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - omniroute_data:/app/data
    networks:
      - web_net
      - app_net
    labels:
      - "traefik.enable=true"
      # HTTP-to-HTTPS redirect
      - "traefik.http.routers.http-omniroute.rule=Host(`${omniroute_main_domain}`)"
      - "traefik.http.routers.http-omniroute.entrypoints=web"
      # HTTPS route
      - "traefik.http.routers.omniroute.rule=Host(`${omniroute_main_domain}`)"
      - "traefik.http.routers.omniroute.entrypoints=web-secure"
      - "traefik.http.routers.omniroute.tls=true"
      - "traefik.http.routers.omniroute.tls.certresolver=myproduction"
      - "traefik.http.routers.omniroute.service=omniroute"
      - "traefik.http.services.omniroute.loadBalancer.server.port=${omniroute_port}"

networks:
  web_net:
    name: web_net
    external: true
  app_net:
    name: app_net
    external: true

volumes:
  redis_data:
    name: omniroute_redis_data
    external: false
  omniroute_data:
    name: omniroute_data
    external: false
