server {
    listen 8080;
    server_name _;

    # Only the LOCAL_ONLY exportAll endpoint is proxied here. The app treats
    # requests stamped as "via reverse proxy" (X-Forwarded-For / X-Real-IP) as
    # remote and rejects them with 403 LOCAL_ONLY. Remove those forwarded
    # headers so the request appears to the app as a trusted private-LAN peer,
    # which the route guard permits for authenticated dashboard sessions.
    location /api/db-backups/exportAll {
        proxy_pass http://omniroute:20128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}