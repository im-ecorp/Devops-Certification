# HTTP-only explicit forward proxy. Do not load proxy_connect for this lab.
# Required modules: proxy, proxy_http, authz_core, authz_host.
Listen 127.0.0.1:18083
<VirtualHost 127.0.0.1:18083>
    ServerName localhost
    ProxyRequests On
    ProxyVia On
    ProxyTimeout 15

    # Default deny: both destination and client must be approved.
    <Proxy "*">
        Require all denied
    </Proxy>

    # Exact local HTTP origin only; no arbitrary hosts, ports or CONNECT.
    <ProxyMatch "^http://127\.0\.0\.1:19001(?:/|$)">
        Require ip 127.0.0.1
    </ProxyMatch>

    # This listener is a proxy, not a document server.
    <Location "/">
        <LimitExcept GET HEAD POST OPTIONS>
            Require all denied
        </LimitExcept>
    </Location>
</VirtualHost>
