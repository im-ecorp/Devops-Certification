# Requires Apache 2.4.47+ with proxy and proxy_http loaded.
Listen 127.0.0.1:18082
<VirtualHost 127.0.0.1:18082>
    ServerName localhost
    ProxyRequests Off
    ProxyPreserveHost Off
    ProxyTimeout 15

    <Proxy "*">
        Require ip 127.0.0.1
    </Proxy>

    # Specific routes must precede the catch-all mapping.
    # mod_proxy_http handles the WebSocket upgrade in Apache 2.4.47+.
    ProxyPass        "/ws/" "http://127.0.0.1:19001/ws/" upgrade=websocket connectiontimeout=3 timeout=60
    ProxyPassReverse "/ws/" "http://127.0.0.1:19001/ws/"
    ProxyPass        "/" "http://127.0.0.1:19001/" connectiontimeout=3 timeout=15
    ProxyPassReverse "/" "http://127.0.0.1:19001/"
</VirtualHost>
