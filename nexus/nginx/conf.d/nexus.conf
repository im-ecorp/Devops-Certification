# Regular Nginx configuration. Replace w.k8sforfun.com in every server_name.
# Install a certificate covering all seven names at the paths below.
# This file is loaded inside the standard nginx image's http {} context.
upstream nexus_web {
    server nexus:8081;
    keepalive 16;
}

upstream docker_hub {
    server nexus:9091;
    keepalive 16;
}

upstream docker_quay {
    server nexus:9092;
    keepalive 16;
}

upstream docker_k8s {
    server nexus:9093;
    keepalive 16;
}

upstream docker_gcr {
    server nexus:9094;
    keepalive 16;
}

upstream docker_k8s_gcr {
    server nexus:9095;
    keepalive 16;
}

upstream docker_github {
    server nexus:9096;
    keepalive 16;
}

server {
    listen 80;
    server_name repo.w.k8sforfun.com hub.w.k8sforfun.com quay.w.k8sforfun.com k8s.w.k8sforfun.com
                gcr.w.k8sforfun.com k8s-gcr.w.k8sforfun.com github.w.k8sforfun.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name repo.w.k8sforfun.com;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;
    client_body_timeout 300s;

    location / {
        proxy_pass http://nexus_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}

